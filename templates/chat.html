<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>The Inner Citadel</title>

  <!-- Bootstrap & FontAwesome -->
  <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.1.1/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.2.1/jquery.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.1.1/js/bootstrap.min.js"></script>
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.5.0/css/all.css" />

  <!-- Font similar to Perplexity -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- Custom CSS -->
  <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}" />
</head>

<body>
  <div class="container-fluid h-100">
    <div class="row justify-content-center h-100">
      <div class="col-md-8 col-xl-6 chat">
        <div class="card shadow-sm border-0">

          <!-- Header -->
          <div class="card-header msg_head bg-white border-0">
            <div class="user_info">
              <span class="chat_title">The Inner Citadel</span>
              <p class="subtitle">Nowhere you can go is more peaceful—more free of interruptions—than your own soul. Retreat into your inner citadel.</p>
            </div>
          </div>

          <!-- Chat Area -->
          <div id="messageFormeight" class="card-body msg_card_body bg-light"></div>

          <!-- Input -->
          <div class="card-footer bg-white border-0">
            <form id="messageArea" class="input-group">
              <input
                type="text"
                id="text"
                name="msg"
                placeholder="Ask what you seek to understand."
                autocomplete="off"
                class="form-control type_msg"
                required
              />
              <div class="input-group-append">
                <button type="submit" id="send" class="input-group-text send_btn">
                  <i class="fas fa-paper-plane"></i>
                </button>
              </div>
            </form>
          </div>

        </div>
      </div>
    </div>
  </div>

  <!-- JS Logic -->
  <script>
    $(document).ready(function () {
      $("#messageArea").on("submit", function (event) {
        event.preventDefault();

        const date = new Date();
        const str_time = date.getHours().toString().padStart(2, "0") + ":" + date.getMinutes().toString().padStart(2, "0");
        const rawText = $("#text").val();

        // User message
        const userHtml = `
          <div class="d-flex justify-content-end mb-3 fade-in">
            <div class="msg_cotainer_send">
              ${rawText}
              <span class="msg_time_send">${str_time}</span>
            </div>
          </div>`;
        $("#text").val("");
        $("#messageFormeight").append(userHtml);
        $("#messageFormeight").scrollTop($("#messageFormeight")[0].scrollHeight);

        // Typing indicator
        const loadingHtml = `
          <div id="typingIndicator" class="d-flex justify-content-start mb-3 fade-in">
            <div class="msg_cotainer typing">
              <span><i class="fas fa-ellipsis-h"></i></span>
            </div>
          </div>`;
        $("#messageFormeight").append(loadingHtml);
        $("#messageFormeight").scrollTop($("#messageFormeight")[0].scrollHeight);

        // Send AJAX request
        $.ajax({
          data: { msg: rawText },
          type: "POST",
          url: "/get",
        }).done(function (data) {
          $("#typingIndicator").remove(); // remove buffer
          const botHtml = `
            <div class="d-flex justify-content-start mb-3 fade-in">
              <div class="msg_cotainer">
                ${data}
                <span class="msg_time">${str_time}</span>
              </div>
            </div>`;
          $("#messageFormeight").append($.parseHTML(botHtml));
          $("#messageFormeight").scrollTop($("#messageFormeight")[0].scrollHeight);
        });
      });
    });
  </script>

  <style>
    /* Fade animation */
    .fade-in { animation: fadeIn 0.3s ease-in-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

    .typing {
      background-color: #f1f3f4 !important;
      color: #666 !important;
      font-style: italic;
    }
  </style>
</body>
</html>
